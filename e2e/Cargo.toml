[package]
name = "vertigo-forms-e2e"
version = "0.1.0"
edition = "2024"
publish = false

# The library only serves the suites in tests/
[lib]
test = false
doctest = false

[dependencies]
actix-web = "4"
anyhow = "1.0"
libtest-mimic = "0.8"
serde_json = "1.0"
thirtyfour = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
vertigo-cli = "0.13"

[[test]]
name = "storybook"
path = "tests/storybook/main.rs"
harness = false
