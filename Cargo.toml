[workspace]
members = ["storybook", "examples/manual_form", "examples/model_form", "e2e"]

[workspace.package]
version = "0.2.4"

[package]
name = "vertigo-forms"
version.workspace = true
authors = ["Michał Pokrywka <wolfmoon@o2.pl>"]
description = "Building block for forms in vertigo"
readme = { workspace = true }
keywords = ["wasm", "web", "isomorphic", "reactive", "javascript"]
homepage = "https://vertigo.znoj.pl"
repository = "https://github.com/vertigo-web/vertigo-forms"
documentation = "https://docs.rs/vertigo-forms/"
categories = ["asynchronous", "gui", "wasm", "web-programming"]
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
vertigo = "0.14.4"
vertigo-testing = "0.14.4"

[dependencies]
base64 = "0.23"
either = "1.15"
vertigo = { workspace = true }

[patch.crates-io]
vertigo = { git = "https://github.com/vertigo-web/vertigo.git", branch = "master" }
vertigo-cli = { git = "https://github.com/vertigo-web/vertigo.git", branch = "master" }
vertigo-testing = { git = "https://github.com/vertigo-web/vertigo.git", branch = "master" }
