[workspace]
members = ["storybook", "examples/manual_form", "examples/model_form", "e2e"]

[package]
name = "vertigo-forms"
version = "0.2.1"
authors = ["Michał Pokrywka <wolfmoon@o2.pl>"]
description = "Building block for forms in vertigo"
readme = { workspace = true }
keywords = ["wasm", "web", "isomorphic", "reactive", "javascript"]
homepage = "https://vertigo.znoj.pl"
repository = "https://github.com/vertigo-web/vertigo-forms"
documentation = "https://docs.rs/vertigo-forms/"
categories = ["asynchronous", "gui", "wasm", "web-programming"]
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
vertigo = "0.13"

[dependencies]
base64 = "0.23"
either = "1.15"
vertigo = { workspace = true }

[patch.crates-io]
# vertigo = { git = "https://github.com/vertigo-web/vertigo", branch = "master" }
vertigo = { git = "https://github.com/vertigo-web/vertigo", branch = "e2e-harness" }
vertigo-cli = { git = "https://github.com/vertigo-web/vertigo", branch = "e2e-harness" }
# vertigo = { path = "../vertigo/crates/vertigo" }
# vertigo-cli = { path = "../vertigo/crates/vertigo-cli" }
